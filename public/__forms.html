<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Form Detection</title></head>
<body>
  <!-- This page exists only so Netlify's build-time form detection registers both forms. -->
  <form name="quote" data-netlify="true" netlify-honeypot="company" hidden>
    <input type="text" name="company" />
    <input type="text" name="name" />
    <input type="tel" name="phone" />
    <input type="text" name="project_type" />
    <input type="hidden" name="traffic_source" />
    <input type="hidden" name="landing_url" />
        <input name="street_address" />
      <input name="city" />
      <input name="state" />
      <input name="zip" />
    </form>

  <form name="contact" data-netlify="true" netlify-honeypot="company" hidden>
    <input type="text" name="company" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
    <input type="hidden" name="traffic_source" />
    <input type="hidden" name="landing_url" />
  </form>
</body>
</html>
